# Six Spring Boot services: restricted pods, read-only root FS, Spring health probes,
# init container waits for Postgres + Keycloak.
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector: {app.kubernetes.io/name: orchestrator}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Never take the running version down before the new one is Ready: a bad image (or one blocked by
  # the downgrade guard) leaves the old pod serving, and Argo CD reports the rollout as Degraded.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  progressDeadlineSeconds: 600
  selector:
    matchLabels: {app.kubernetes.io/name: orchestrator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: scalesafe, scalesafe.io/tier: service}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-deps
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z keycloak 8080; do echo waiting; sleep 3; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsUser: 65534
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      containers:
        - name: app
          image: scalesafe-orchestrator
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/scalesafe"}
            - {name: SPRING_DATASOURCE_USERNAME, value: orchestrator}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: scalesafe-db, key: orchestrator}}}
            - {name: SCALESAFE_SECURITY_CLIENT_ID, value: orchestrator}
            - {name: SCALESAFE_SECURITY_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: scalesafe-oidc, key: orchestrator}}}
            - {name: SCALESAFE_SECURITY_ISSUER, valueFrom: {configMapKeyRef: {name: scalesafe-urls, key: OIDC_ISSUER}}}
            - {name: SCALESAFE_SECURITY_JWKS_URI, value: "http://keycloak:8080/realms/scalesafe/protocol/openid-connect/certs"}
            - {name: SCALESAFE_SECURITY_TOKEN_URI, value: "http://keycloak:8080/realms/scalesafe/protocol/openid-connect/token"}
            - {name: SCALESAFE_CORS_ALLOWED_ORIGINS, valueFrom: {configMapKeyRef: {name: scalesafe-urls, key: CORS_ORIGINS}}}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"}
            - {name: SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS, value: "*:pending"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /health/liveness, port: http}
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/liveness, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
