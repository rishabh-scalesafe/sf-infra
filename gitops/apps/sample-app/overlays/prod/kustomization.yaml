apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app
resources:
  - ../../base
  - ingress.yaml
# Tekton (gitops-update-image task) rewrites newTag on every successful build of main.
images:
  - name: sample-app
    newName: ghcr.io/__GITHUB_ORG__/sample-app
    newTag: "latest"
