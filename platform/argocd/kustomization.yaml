# Argo CD (pinned). Applied by scripts/bootstrap-platform.sh, then self-managed by Argo CD
# via gitops/argocd/apps/argocd.yaml once the repo is on GitHub.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.7/manifests/install.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-rbac-cm.yaml
  - path: argocd-cmd-params-cm.yaml
