# ScaleSafe application namespace: restricted Pod Security (every ScaleSafe image runs non-root).
apiVersion: v1
kind: Namespace
metadata:
  name: scalesafe
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: scalesafe-quota
  namespace: scalesafe
spec:
  hard:
    requests.memory: 6Gi
    limits.memory: 12Gi
    persistentvolumeclaims: "5"
