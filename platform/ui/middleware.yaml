# Security headers for the platform UIs (Traefik, bundled with k3s).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ui-headers
  namespace: tekton-pipelines
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: same-origin
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ui-headers
  namespace: argocd
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: same-origin
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
