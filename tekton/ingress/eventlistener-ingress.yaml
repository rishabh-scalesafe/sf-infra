# Optional: expose the GitHub webhook receiver. Apply only after DNS points at the cluster.
#   kubectl apply -f tekton/ingress/eventlistener-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-webhooks
  namespace: ci
spec:
  ingressClassName: traefik
  rules:
    - host: hooks.indiescale.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: el-github
                port:
                  number: 8080
